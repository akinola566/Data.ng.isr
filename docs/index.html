<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Welcome to ISR Data Service</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background-color: #0f0f1a;
      color: #ffffff;
    }

    .main-container {
      padding: 60px 20px;
      max-width: 900px;
      margin: 0 auto;
      text-align: center;
    }

    .brand-name {
      font-size: 3.5rem;
      font-weight: 900;
      background: linear-gradient(90deg, #00d2ff, #3a47d5);
      -webkit-background-clip: text;
      color: transparent;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0); }
    }

    .welcome-message {
      margin-top: 40px;
      font-size: 2.1rem;
      font-weight: bold;
      color: #fefefe;
      text-shadow: 2px 2px 4px #000;
    }

    .message {
      font-size: 1.05rem;
      margin: 20px auto;
      color: #ccc;
      max-width: 700px;
    }

    .get-started-button {
      display: inline-block;
      margin-top: 30px;
      padding: 14px 28px;
      font-size: 1rem;
      font-weight: bold;
      background: linear-gradient(135deg, #00d2ff, #3a47d5);
      border: none;
      border-radius: 10px;
      color: #000;
      text-decoration: none;
      transition: 0.3s ease;
    }

    .get-started-button:hover {
      transform: scale(1.05);
      opacity: 0.9;
    }

    .footer {
      margin-top: 80px;
      text-align: center;
      font-size: 0.9rem;
      color: #888;
    }

    .footer-links {
      list-style: none;
      padding: 0;
      margin-top: 10px;
    }

    .footer-links li {
      display: inline-block;
      margin: 0 10px;
    }

    .footer-links a {
      color: #00d2ff;
      text-decoration: none;
    }

    .footer-links a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="main-container">
    <div class="brand-name">ISR Data Service</div>
    <div class="welcome-message">Welcome to ISR Data Service</div>
    <p class="message">
      We encourage you to explore a smart, student-centric platform built to manage and simplify your academic and data experience.
    </p>

    <a href="dashboard.html" class="get-started-button">Get Started</a>

    <div class="footer">
      <ul class="footer-links">
        <li><a href="#">Home</a></li>
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="#">Support</a></li>
        <li><a href="#">Privacy</a></li>
      </ul>
      <p>&copy; 2025 ISR Data Service. All rights reserved.</p>
    </div>
  </div>
</body>
</html>
