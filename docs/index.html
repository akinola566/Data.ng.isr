<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Data Service Dashboard</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: #f1f3f6;
    }

    .header {
      background: #006aff;
      color: white;
      padding: 1rem;
      text-align: center;
      font-size: 1.5rem;
      font-weight: bold;
    }

    .wallet {
      background: white;
      margin: 1rem;
      padding: 1.5rem;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      text-align: center;
    }

    .wallet h2 {
      margin: 0.5rem 0;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin-top: 1rem;
    }

    .buttons button {
      background: #006aff;
      color: white;
      border: none;
      padding: 0.8rem 1.5rem;
      border-radius: 8px;
      cursor: pointer;
    }

    .transactions {
      background: white;
      margin: 1rem;
      padding: 1rem;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }

    .transactions h3 {
      margin-bottom: 1rem;
    }

    .transaction {
      display: flex;
      justify-content: space-between;
      padding: 0.8rem 0;
      border-bottom: 1px solid #eee;
    }

    .transaction:last-child {
      border-bottom: none;
    }

    .loading-screen {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: white;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 2rem;
      font-weight: bold;
      color: #006aff;
      z-index: 9999;
      animation: fadeOut 1.5s ease 2s forwards;
    }

    @keyframes fadeOut {
      to { opacity: 0; visibility: hidden; }
    }
  </style>
</head>
<body>
  <div class="loading-screen">Getting Started...</div>

  <div class="header">Data Service Wallet</div>

  <div class="wallet">
    <p>Hello, <strong>John Doe</strong></p>
    <p>Naira Wallet Balance</p>
    <h2>₦7,381,340.02</h2>
    <div class="buttons">
      <button>Buy Data</button>
      <button>Request</button>
    </div>
  </div>

  <div class="transactions">
    <h3>Recent Transactions</h3>
    <div class="transaction">
      <span>MTN Data - 10GB</span>
      <span style="color: red;">₦5,000</span>
    </div>
    <div class="transaction">
      <span>Wallet Top-Up</span>
      <span style="color: green;">₦20,000</span>
    </div>
    <div class="transaction">
      <span>Airtel Data - 5GB</span>
      <span style="color: red;">₦2,500</span>
    </div>
  </div>
</body>
  </html>
